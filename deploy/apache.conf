# Included inside gunning.se's HTTPS VirtualHost. Apache runs in php8site;
# Rust binds only to the host's Docker bridge, not the public network interface.
# Keep WebSocket mapping before the broader HTTP mapping.
RewriteEngine On
RewriteCond %{HTTP_HOST} !^gunning\.se(?::443)?$ [NC]
RewriteRule ^/?Valhallasc(?:/|$) https://gunning.se%{REQUEST_URI} [R=302,L,NE]
RedirectMatch 302 ^/Valhallasc$ /Valhallasc/
ProxyPass /Valhallasc/ws ws://172.18.0.1:8080/ws disablereuse=on
ProxyPassReverse /Valhallasc/ws ws://172.18.0.1:8080/ws
ProxyPass /Valhallasc/ http://172.18.0.1:8080/ disablereuse=on
ProxyPassReverse /Valhallasc/ http://172.18.0.1:8080/

<Location /Valhallasc/>
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://gunning.se; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
</Location>
