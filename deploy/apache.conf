# Included inside gunning.se's HTTPS VirtualHost (000-default.conf: Include /var/www/Valhalla/apache.conf). Apache runs in php8site;
# the game server binds only to the host's Docker bridge, not the public network interface.
# Copied to www/Valhalla/apache.conf by scripts/release_client.sh. Keep WebSocket mapping before the broader HTTP mapping.
RewriteEngine On
RewriteCond %{HTTP_HOST} !^gunning\.se(?::443)?$ [NC]
RewriteRule ^/?Valhalla(?:sc)?(?:/|$) https://gunning.se%{REQUEST_URI} [R=302,L,NE]
RedirectMatch 302 ^/Valhalla$ /Valhalla/

# The game lives at /Valhalla/ (1.0.0, 2026-11-16).
ProxyPass /Valhalla/ws ws://172.18.0.1:8080/ws disablereuse=on
ProxyPassReverse /Valhalla/ws ws://172.18.0.1:8080/ws
ProxyPass /Valhalla/ http://172.18.0.1:8080/ disablereuse=on
ProxyPassReverse /Valhalla/ http://172.18.0.1:8080/

# Legacy address /Valhallasc/: only the entry page redirects (old bookmarks, the old Windows client and APKs follow it); everything
# else under it keeps proxying, so a tab opened before the move, its WebSocket and its sign-in calls keep working.
ProxyPassMatch ^/Valhallasc/?$ !
RedirectMatch 302 ^/Valhallasc/?$ /Valhalla/
ProxyPass /Valhallasc/ws ws://172.18.0.1:8080/ws disablereuse=on
ProxyPassReverse /Valhallasc/ws ws://172.18.0.1:8080/ws
ProxyPass /Valhallasc/ http://172.18.0.1:8080/ disablereuse=on
ProxyPassReverse /Valhallasc/ http://172.18.0.1:8080/

<LocationMatch "^/Valhalla(sc)?/">
  Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://gunning.se; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"
</LocationMatch>
